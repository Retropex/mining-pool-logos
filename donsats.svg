<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient with Subtle Crimson Hue -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12080a" />
      <stop offset="50%" stop-color="#1a1114" />
      <stop offset="100%" stop-color="#0a0506" />
    </linearGradient>

    <!-- Deep Obsidian / Black Metallic Gradient for D -->
    <linearGradient id="blackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a" />
      <stop offset="50%" stop-color="#222222" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </linearGradient>

    <!-- Vibrant Crimson Red Gradient for S -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#e60000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ff0000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Dark Shield/Square Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" rx="40" />
  
  <!-- Subtle Outer Accent Ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#redGradient)" stroke-width="2" opacity="0.3" stroke-dasharray="12 8" />

  <g filter="url(#dropShadow)">
    <!-- Letter 'D' - Sleek Obsidian Black -->
    <path fill="url(#blackGradient)" stroke="#ff3b30" stroke-width="1.5" stroke-opacity="0.4" d="
      M 110,130 
      H 210 
      C 275,130 320,170 320,250 
      C 320,330 275,370 210,370 
      H 110 
      V 130 Z 
      M 160,180 
      V 320 
      H 205 
      C 240,320 268,295 268,250 
      C 268,205 240,180 205,180 
      H 160 Z
    " />

    <!-- Letter 'S' - Bold Crimson Red -->
    <path fill="url(#redGradient)" opacity="0.98" d="
      M 370,180 
      H 275 
      C 255,180 245,190 245,205 
      C 245,220 255,228 280,235 
      L 330,250 
      C 370,262 390,285 390,320 
      C 390,360 355,370 300,370 
      H 210 
      V 325 
      H 300 
      C 325,325 338,318 338,302 
      C 338,288 325,280 300,272 
      L 250,258 
      C 215,248 195,228 195,195 
      C 195,150 235,130 285,130 
      H 370 
      V 180 Z
    " />
  </g>
</svg>
